apis:
- aid: claim-genius:geniusapi-suite
  name: Claim Genius GeniusAPI Suite
  description: >-
    The GeniusAPI Suite is Claim Genius's REST integration layer over its AI vehicle-inspection
    products. Documented flow: generate a JWT via /api/auth/token using an API ID and secret, upload
    JPG/PNG/MP4/MOV media via /api/file/upload, POST claim metadata to /api/pipelines/{pipelineName}
    to receive a queue ID, then poll /api/pipeline/requests/{requestId} for structured JSON results —
    damage classification, repair/replace decisions, labor and paint hours, OEM part pricing, ACV and
    total repair estimates, and media links returned as signed URLs. Vehicle make/model/variant and
    vehicle-code lookup endpoints normalize VIN inputs. Pipeline paths are date-versioned (for example
    /api/pipelines/202103/...) for backward compatibility. The company advertises an OpenAPI 3.0 spec
    and native iOS/Android capture SDKs, but neither is published publicly — developer access and
    documentation are requested by email.
  humanURL: https://claimgenius.com/geniusapi
  tags:
  - Vehicle Inspection
  - Damage Assessment
  - Claims Automation
  - Computer-Vision
  tags_raw:
  - Vehicle Inspection
  - Damage Assessment
