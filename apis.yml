aid: claim-genius
name: Claim Genius
description: >-
  Claim Genius is an AI vehicle-inspection and automated damage-assessment company serving auto
  insurance claims, underwriting, dealerships, salvage, lease and rental, fleet and collision repair.
  Its GeniusINSPECT engine converts vehicle photos and video into structured, decision-ready data —
  per-part damage classification (scratch, dent, tear, glass, wheel), repair-versus-replace decisions,
  labor and paint hours, OEM part pricing, repairability status and total-loss probability. The
  capabilities are packaged as products (GeniusINSPECT for Claims, GeniusINSPECT for Underwriting,
  GeniusPrepost, GeniusOPS) and exposed to integrators through the GeniusAPI Suite, a JWT-authenticated
  REST API with asynchronous pipeline processing. The company has operated across the US, EU and Asia
  since 2018.
