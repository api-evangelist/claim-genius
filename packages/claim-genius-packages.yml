summary: >-
  Claim Genius ships no maintained, publicly distributed client library. Two npm packages were published
  from Claim Genius email addresses in December 2018 and never updated — both are demo/test artifacts at
  v0.0.1 and v1.0.1, not a client SDK program. The company advertises "native SDKs" for iOS and Android
  photo/video capture, but they are not distributed through any public registry (no CocoaPods, SPM,
  Maven Central or npm listing found) and are obtained through the same gated developer-access request
  as the API itself. No SDKs pointer is emitted: crediting an SDK program from two abandoned 2018 demo
  packages would misstate what an integrator can actually pick up.
